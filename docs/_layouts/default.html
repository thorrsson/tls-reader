<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
    <script src="{{ '/assets/downloads.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="TLS Reader documentation home">
          <span class="wordmark-icon" aria-hidden="true">TLS</span>
          <span>TLS Reader</span>
        </a>
        <nav aria-label="Main navigation">
          <a href="{{ '/getting-started/' | relative_url }}">Get started</a>
          <a href="{{ '/reading/' | relative_url }}">Reading</a>
          <a href="{{ '/troubleshooting/' | relative_url }}">Troubleshooting</a>
          <a href="https://github.com/thorrsson/tls-reader/releases/latest" data-download="auto">Downloads</a>
        </nav>
      </div>
    </header>
    <main id="main" class="content">
      {{ content }}
      <p data-download-status role="status" hidden></p>
    </main>
    <footer class="site-footer">
      <div class="footer-inner">
        <span>TLS Reader is an open-source desktop ebook reader.</span>
        <a href="https://github.com/thorrsson/tls-reader">View the project on GitHub</a>
      </div>
    </footer>
  </body>
</html>
