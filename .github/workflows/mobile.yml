name: Mobile CI and release

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "test/pages-downloads.test.cjs"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "test/pages-downloads.test.cjs"

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate mobile release configuration
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'ci' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release tag, backend URLs, and store credentials
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          NEXT_PUBLIC_TLS_API_BASE_URL: ${{ vars.NEXT_PUBLIC_TLS_API_BASE_URL }}
          NEXT_PUBLIC_TLS_AUTH_URL: ${{ vars.NEXT_PUBLIC_TLS_AUTH_URL }}
          NEXT_PUBLIC_TLS_CATALOG_URL: ${{ vars.NEXT_PUBLIC_TLS_CATALOG_URL }}
          IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_PLAY_RELEASE_STATUS: ${{ vars.ANDROID_PLAY_RELEASE_STATUS }}
        run: |
          node <<'NODE'
          const { mobileVersion } = require("./scripts/mobile-version.cjs");
          try {
            mobileVersion(process.env.RELEASE_TAG, process.env.BUILD_NUMBER);
          } catch (error) {
            console.error(error.message);
            process.exitCode = 1;
          }

          for (const name of ["NEXT_PUBLIC_TLS_API_BASE_URL", "NEXT_PUBLIC_TLS_AUTH_URL", "NEXT_PUBLIC_TLS_CATALOG_URL"]) {
            let url;
            try {
              url = new URL(process.env[name]);
            } catch {
              console.error(`${name} must be a valid HTTPS URL for a release.`);
              process.exitCode = 1;
              continue;
            }
            if (url.protocol !== "https:" || !url.hostname || url.username || url.password) {
              console.error(`${name} must be an HTTPS URL without embedded credentials for a release.`);
              process.exitCode = 1;
            }
          }

          const storeSecrets = [
            "IOS_DISTRIBUTION_CERTIFICATE_P12",
            "IOS_DISTRIBUTION_CERTIFICATE_PASSWORD",
            "IOS_PROVISIONING_PROFILE",
            "NOTARY_API_KEY_ID",
            "NOTARY_API_ISSUER_ID",
            "NOTARY_API_KEY_P8",
            "ANDROID_UPLOAD_KEYSTORE",
            "ANDROID_UPLOAD_KEYSTORE_PASSWORD",
            "ANDROID_KEY_ALIAS",
            "ANDROID_KEY_PASSWORD",
            "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON",
          ];
          const missing = storeSecrets.filter((name) => !process.env[name]);
          if (missing.length > 0) {
            console.error(`Mobile release credentials are missing: ${missing.join(", ")}.`);
            process.exitCode = 1;
          }
          const status = process.env.ANDROID_PLAY_RELEASE_STATUS;
          if (status && !["completed", "draft"].includes(status)) {
            console.error("ANDROID_PLAY_RELEASE_STATUS must be completed or draft.");
            process.exitCode = 1;
          }
          NODE

  ios:
    name: iOS
    needs: validate-release
    runs-on: macos-26
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'ci' }}
    env:
      NEXT_PUBLIC_TLS_API_BASE_URL: ${{ vars.NEXT_PUBLIC_TLS_API_BASE_URL || 'http://localhost:8080' }}
      NEXT_PUBLIC_TLS_AUTH_URL: ${{ vars.NEXT_PUBLIC_TLS_AUTH_URL || 'http://localhost:8080/auth/login' }}
      NEXT_PUBLIC_TLS_CATALOG_URL: ${{ vars.NEXT_PUBLIC_TLS_CATALOG_URL || 'http://localhost:8080/opds/publications' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.8

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mobile web bundle
        run: pnpm mobile:build

      - name: Sync Capacitor iOS project
        run: pnpm exec cap sync ios

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build CODE_SIGNING_ALLOWED=NO

      - name: Compute release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/mobile-version.cjs

      - name: Archive and upload to TestFlight
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: bash scripts/ios-testflight.sh

  android:
    name: Android
    needs: validate-release
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'ci' }}
    env:
      NEXT_PUBLIC_TLS_API_BASE_URL: ${{ vars.NEXT_PUBLIC_TLS_API_BASE_URL || 'http://localhost:8080' }}
      NEXT_PUBLIC_TLS_AUTH_URL: ${{ vars.NEXT_PUBLIC_TLS_AUTH_URL || 'http://localhost:8080/auth/login' }}
      NEXT_PUBLIC_TLS_CATALOG_URL: ${{ vars.NEXT_PUBLIC_TLS_CATALOG_URL || 'http://localhost:8080/opds/publications' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.8

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mobile web bundle
        run: pnpm mobile:build

      - name: Sync Capacitor Android project
        run: pnpm exec cap sync android

      - name: Build debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Compute release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/mobile-version.cjs

      - name: Build signed Android App Bundle
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          TLS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          TLS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TLS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export TLS_ANDROID_KEYSTORE="$RUNNER_TEMP/upload-keystore.jks"
          trap 'rm -f "$TLS_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE" | base64 --decode > "$TLS_ANDROID_KEYSTORE"
          test -s "$TLS_ANDROID_KEYSTORE"
          ./gradlew bundleRelease -PtlsVersionCode="$TLS_BUILD_NUMBER" -PtlsVersionName="$TLS_VERSION_NAME"
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -x 'jar verified.' >/dev/null

      - name: Upload Android App Bundle artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          if-no-files-found: error
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Decode Google Play service account
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | base64 --decode > "$RUNNER_TEMP/play-service-account.json"
          test -s "$RUNNER_TEMP/play-service-account.json"

      - name: Upload to Google Play internal track
        if: startsWith(github.ref, 'refs/tags/v')
        # v1.1.5
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJson: ${{ runner.temp }}/play-service-account.json
          packageName: com.tlslibrary.reader
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ github.ref_name }}
          track: internal
          status: ${{ vars.ANDROID_PLAY_RELEASE_STATUS || 'completed' }}

      - name: Remove Google Play service account
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: rm -f "$RUNNER_TEMP/play-service-account.json"
